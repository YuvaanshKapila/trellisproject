<!DOCTYPE html>
<html>
<head>
  <title>Todo Agent</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    .buttons a { display: inline-block; padding: 10px 16px; margin: 4px; background: #5865F2; color: white; text-decoration: none; border-radius: 6px; }
    #messages { border: 1px solid #ccc; border-radius: 8px; height: 300px; overflow-y: auto; padding: 12px; margin: 20px 0; }
    .you { text-align: right; color: #333; margin: 6px 0; }
    .bot { text-align: left; color: #5865F2; margin: 6px 0; white-space: pre-wrap; }
    #input { width: 78%; padding: 10px; }
    #send { padding: 10px 16px; }
  </style>
</head>
<body>
  <h1>Todo Agent</h1>

  <div class="buttons">
    <a href="https://discord.com/oauth2/authorize?client_id=1517830632401797170&permissions=67584&integration_type=0&scope=bot">Add to Discord</a>
    <a href="https://slack.com/oauth/v2/authorize?client_id=11400517866979.11410511579780&scope=chat:write,app_mentions:read,im:history&redirect_uri=https://engaging-dripping-gauging.ngrok-free.dev/slack/oauth">Add to Slack</a>
    <a href="#">Add to WhatsApp</a>
  </div>

  <div id="messages"></div>

  <input id="input" placeholder="type a message" />
  <button id="send">send</button>

  <script>
    const messages = document.getElementById("messages");
    const input = document.getElementById("input");

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = who;
      div.textContent = text;
      messages.appendChild(div);
      messages.scrollTop = messages.scrollHeight;
    }

    async function send() {
      const text = input.value;
      if (!text) return;
      addMessage(text, "you");
      input.value = "";
      const res = await fetch("/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: text })
      });
      const data = await res.json();
      addMessage(data.reply, "bot");
    }

    document.getElementById("send").onclick = send;
    input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
